name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# 공개 저장소다. 워크플로는 읽기 권한만 쓰고 시크릿을 쓰지 않는다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # 서명 키와 local.properties 없이 빌드한다.
      - name: Build
        run: ./gradlew assembleDebug --console=plain

      # 빌드가 Room 스키마 JSON을 app/schemas에 다시 쓴다. 엔티티를 바꾸고 JSON을 커밋하지 않았거나
      # 버전을 올리고 새 JSON을 더하지 않았으면 여기서 걸린다. 추적하지 않은 파일도 보려고 git status를 쓴다
      # (docs/architecture.md "스키마 버전 관리").
      - name: Room schema JSON is committed
        run: |
          changes=$(git status --porcelain -- app/schemas)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- app/schemas
            echo "app/schemas가 커밋한 것과 다릅니다. 빌드가 만든 스키마 JSON을 함께 커밋하세요."
            exit 1
          fi

      # 단위 테스트(ManifestPermissionTest)는 디버그 매니페스트를 본다. 릴리스는 여기서 본다(DATA-02).
      - name: Release manifest has no INTERNET permission
        run: |
          ./gradlew processReleaseMainManifest --console=plain
          manifest=app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          test -f "$manifest" || { echo "병합된 릴리스 매니페스트를 찾지 못했습니다: $manifest"; exit 1; }
          grep 'uses-permission' "$manifest" || true
          if grep -q '"android.permission.INTERNET"' "$manifest"; then
            echo "릴리스 매니페스트에 INTERNET 권한이 있습니다."
            exit 1
          fi

      - name: Lint
        run: ./gradlew lint --console=plain

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  # 머지 판단용 단일 검사. 저장소 설정에서 이 검사 하나를 필수로 건다.
  # job을 추가하면 needs에 함께 넣는다.
  ci-passed:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 모든 CI job 성공 확인
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job 결과: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || { echo "성공하지 않은 job이 있습니다."; exit 1; }; done
