name: CI

on:
  pull_request:
    # 기본(opened, synchronize, reopened)에 더해 본문·라벨이 바뀌어도 test-guard를 다시 돌린다.
    # 이때는 같은 커밋의 빌드 결과를 다시 쓰고 build를 건너뛴다(build-plan).
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [develop, main]

# 공개 저장소다. 워크플로는 읽기 권한만 쓰고 시크릿을 쓰지 않는다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # build를 돌릴지 정한다. 본문 수정과 라벨 변경(edited, labeled, unlabeled)은 커밋이 그대로이므로
  # 같은 head 커밋에서 끝난 build 결과(성공이나 실패)가 있으면 그것을 다시 쓰고 build를 건너뛴다.
  # 그런 결과가 없거나(진행 중이던 run은 위 concurrency로 취소된다) base 브랜치를 바꿨으면 build를 돌린다.
  build-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run-build: ${{ steps.plan.outputs.run-build }}
      reused-result: ${{ steps.plan.outputs.reused-result }}
    steps:
      - name: build를 돌릴지 정하기
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          build() { echo "build를 돌립니다: $1"; echo "run-build=true" >> "$GITHUB_OUTPUT"; exit 0; }
          case "$EVENT:$ACTION" in
            pull_request:edited|pull_request:labeled|pull_request:unlabeled) ;;
            *) build "$EVENT $ACTION 이벤트" ;;
          esac
          [ "$BASE_CHANGED" != "true" ] || build "base 브랜치가 바뀌었습니다"
          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&status=completed&per_page=50" \
            --jq ".workflow_runs[] | select(.id != $RUN_ID) | .id") || build "이전 run을 조회하지 못했습니다"
          for id in $runs; do
            result=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select(.name == "build") | .conclusion] | first // ""') || continue
            case "$result" in
              success|failure)
                echo "같은 커밋 $HEAD_SHA 의 build 결과($result)를 다시 씁니다: https://github.com/$REPO/actions/runs/$id"
                { echo "run-build=false"; echo "reused-result=$result"; } >> "$GITHUB_OUTPUT"
                exit 0 ;;
            esac
          done
          build "같은 커밋에서 끝난 build가 없습니다"

  build:
    needs: build-plan
    if: needs.build-plan.outputs.run-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # 서명 키와 local.properties 없이 빌드한다.
      - name: Build
        run: ./gradlew assembleDebug --console=plain

      # 빌드가 Room 스키마 JSON을 app/schemas에 다시 쓴다. 엔티티를 바꾸고 JSON을 커밋하지 않았거나
      # 버전을 올리고 새 JSON을 더하지 않았으면 여기서 걸린다. 추적하지 않은 파일도 보려고 git status를 쓴다
      # (docs/architecture.md "스키마 버전 관리").
      - name: Room schema JSON is committed
        run: |
          changes=$(git status --porcelain -- app/schemas)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- app/schemas
            echo "app/schemas가 커밋한 것과 다릅니다. 빌드가 만든 스키마 JSON을 함께 커밋하세요."
            exit 1
          fi

      # 단위 테스트(ManifestPermissionTest)는 디버그 매니페스트를 본다. 릴리스는 여기서 본다(DATA-02).
      - name: Release manifest has no INTERNET permission
        run: |
          ./gradlew processReleaseMainManifest --console=plain
          manifest=app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          test -f "$manifest" || { echo "병합된 릴리스 매니페스트를 찾지 못했습니다: $manifest"; exit 1; }
          grep 'uses-permission' "$manifest" || true
          if grep -q '"android.permission.INTERNET"' "$manifest"; then
            echo "릴리스 매니페스트에 INTERNET 권한이 있습니다."
            exit 1
          fi

      # 릴리스 빌드는 R8로 코드를 줄인다(docs/architecture.md "코드 축소(R8)"). 규칙이 모자라 R8이 실패하면
      # 태그를 단 뒤가 아니라 PR에서 알도록 서명 없이 빌드해 본다. 서명은 release.yml만 한다.
      - name: Release build (R8, unsigned)
        run: ./gradlew assembleRelease --console=plain

      - name: Lint
        run: ./gradlew lint --console=plain

      # 스크린샷 비교도 여기서 돈다. gradle.properties의 roborazzi.test.verify=true로
      # testDebugUnitTest가 app/src/test/screenshots/의 기준 이미지와 비교하고 다르면 실패한다.
      # 머지는 ci-passed 하나로 판단하므로 테스트는 빌드 캐시 결과(FROM-CACHE, UP-TO-DATE)로
      # 건너뛰지 않고 매번 돌린다. --rerun은 바로 앞의 작업에만 걸린다. 빌드와 lint는 캐시를 쓴다.
      - name: Unit tests and screenshot comparison
        run: ./gradlew testDebugUnitTest --rerun --console=plain

      # 실제로 돈 테스트 수를 단계 요약에 남긴다. 결과 파일이 없거나 0개면 실패한다.
      - name: Test count
        if: success() || failure()
        run: |
          dir=app/build/test-results/testDebugUnitTest
          sum() { cat "$dir"/TEST-*.xml 2>/dev/null | grep -o "<testsuite [^>]*" | grep -o " $1=\"[0-9]*\"" | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}'; }
          tests=$(sum tests); failures=$(sum failures); errors=$(sum errors); skipped=$(sum skipped)
          files=$(ls "$dir"/TEST-*.xml 2>/dev/null | wc -l)
          {
            echo "### testDebugUnitTest"
            echo "| 테스트 클래스 | 테스트 | 실패 | 오류 | 건너뜀 |"
            echo "|---|---|---|---|---|"
            echo "| $files | $tests | $failures | $errors | $skipped |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$tests" -gt 0 ] || { echo "실행된 테스트가 없습니다."; exit 1; }

      # 기준과 다른 화면의 실제 이미지(_actual)와 차이 이미지(_compare)를 올린다.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  # 기존 테스트를 지우거나 약하게 바꾸지 않았는지 본다(#43). PR에서만 판정하고 push에서는 자체 테스트만 돈다.
  # 판정 규칙과 예외 표기는 scripts/test-guard.mjs와 AGENTS.md "테스트와 CI"에 있다.
  test-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 판정 스크립트 자체 테스트
        run: |
          node --version
          node --test scripts/test-guard.test.mjs

      # PR 본문과 라벨은 이 단계에서 API로 현재 값을 읽는다. 이전 run을 다시 돌려도 지금 본문을 본다.
      # 읽지 못하면 이벤트 페이로드(PR_BODY, PR_LABELS)를 쓴다. 본문은 env로만 넘기고 스크립트에 끼워 넣지 않는다.
      - name: 기존 테스트 삭제·약화 검사
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          pr_json="$RUNNER_TEMP/pr.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$pr_json" || { echo "PR을 API로 읽지 못해 이벤트 값을 씁니다."; rm -f "$pr_json"; }
          node scripts/test-guard.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --pr-json "$pr_json"

  # 머지 판단용 단일 검사. 저장소 설정에서 이 검사 하나를 필수로 건다.
  # job을 추가하면 needs에 함께 넣는다.
  ci-passed:
    if: always()
    needs: [build-plan, build, test-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 모든 CI job 성공 확인
        # build는 build-plan이 같은 커밋의 성공한 build를 다시 쓰기로 했을 때만 건너뛰어도 된다.
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_BUILD: ${{ needs.build-plan.outputs.run-build }}
          REUSED: ${{ needs.build-plan.outputs.reused-result }}
        run: |
          fail=0
          for job in $(echo "$NEEDS" | jq -r 'keys[]'); do
            result=$(echo "$NEEDS" | jq -r --arg j "$job" '.[$j].result')
            if [ "$job" = build ] && [ "$result" = skipped ] && [ "$RUN_BUILD" = false ]; then
              result="$REUSED"
              echo "$job: 같은 커밋의 이전 결과 $result"
            else
              echo "$job: $result"
            fi
            [ "$result" = success ] || fail=1
          done
          [ "$fail" = 0 ] || { echo "성공하지 않은 job이 있습니다."; exit 1; }
