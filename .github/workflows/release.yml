name: Release

# 버전 태그(v1.2.3, 시험판 v1.2.3-rc.1)를 push하면 서명한 릴리스 APK를 만들어 GitHub Releases에 올린다(REL-01).
# 절차와 버전 규칙은 AGENTS.md "릴리스"에 있다(#30).
# PR에서는 돌지 않는다. 포크에서 온 PR이 서명 시크릿에 닿지 않게 하려고 태그 push만 받는다.
on:
  push:
    tags: ["v*"]

# 기본은 권한 없음. job마다 필요한 것만 준다.
permissions: {}

# 같은 태그를 두 번 올려도 하나씩 돈다. 진행 중인 릴리스는 취소하지 않는다.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 빌드 전에 태그를 확인한다. 쓰기 권한 없이 돈다.
  verify:
    runs-on: ubuntu-latest
    # ci-passed를 기다리는 시간(아래 WAIT_MINUTES)보다 길게 둔다.
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main의 이력을 받아 태그가 main에 있는지 본다.
          fetch-depth: 0
          persist-credentials: false

      # 태그 형식(vX.Y.Z, vX.Y.Z-rc.N)과 versionCode 계산은 scripts/release-version.mjs 한 곳에서 한다.
      - name: 태그 형식 확인
        id: version
        run: |
          out=$(node scripts/release-version.mjs tag "$TAG") || { echo "$out"; exit 1; }
          echo "$out" | tee -a "$GITHUB_OUTPUT"

      # 릴리스는 develop → main 릴리스 PR의 머지 커밋에 태그를 달아 만든다. main에 없는 커밋이면 멈춘다.
      - name: 태그가 main에 있는지 확인
        id: commit
        run: |
          sha=$(git rev-parse "$GITHUB_SHA^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::태그 $TAG 의 커밋 $sha 이 main에 없습니다. develop → main 릴리스 PR의 머지 커밋에 태그를 다세요."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # ci.yml은 main push에서도 돌므로 릴리스 머지 커밋에도 ci-passed 검사가 생긴다. 그 결과가 success여야 빌드한다.
      # 머지 직후 태그를 달면 CI가 아직 돌고 있을 수 있어서 끝날 때까지 WAIT_MINUTES분 기다린다.
      # 기다려도 끝나지 않거나 검사가 생기지 않으면 실패한다. 그때는 CI가 끝난 뒤 이 실행을 다시 돌린다(Re-run jobs).
      # 같은 커밋에 실행이 여럿이면(다시 돌린 경우) 가장 나중에 만든 것을 본다. GitHub Actions가 만든 검사만 본다.
      # API 조회가 잠깐 실패하면 기다리는 동안 다시 본다.
      - name: 태그 커밋의 ci-passed 확인
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
          WAIT_MINUTES: "40"
        run: |
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while :; do
            state="없음"
            if ! latest=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=ci-passed&filter=all&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.id) | last // empty | "\(.status) \(.conclusion // "-") \(.html_url)"'); then
              latest=""
              state="조회 실패"
            fi
            if [ -n "$latest" ]; then
              read -r status conclusion url <<< "$latest"
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "커밋 $SHA 의 ci-passed가 성공했습니다: $url"
                  exit 0
                fi
                echo "::error::태그 커밋 $SHA 의 ci-passed가 $conclusion 입니다($url). CI를 고치거나 다시 돌려 성공시킨 뒤 이 실행을 다시 돌리세요."
                exit 1
              fi
              state="$status"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::태그 커밋 $SHA 의 ci-passed가 ${WAIT_MINUTES}분 안에 끝나지 않았습니다(상태: $state). main의 CI가 끝난 뒤 이 실행을 다시 돌리세요(Re-run jobs)."
              exit 1
            fi
            echo "ci-passed를 기다립니다(상태: $state). 30초 뒤 다시 봅니다."
            sleep 30
          done

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Release를 만들려면 contents: write가 필요하다. 이 job에만 준다.
    permissions:
      contents: write
    # 시크릿은 지금 저장소 시크릿이다. GitHub 환경 release로 옮길지는 소유자가 정한다(#30 "소유자 판단이 남은 것").
    # 옮기면 여기에 `environment: release`를 단다. 환경에 시크릿을 넣기 전에 달면 시크릿을 읽지 못해 실패한다.
    env:
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      # 시크릿 값은 env로만 넘기고 출력하지 않는다. 있는지만 본다.
      - name: 서명 시크릿 확인
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing RELEASE_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::릴리스 서명 시크릿이 없습니다:$missing. 저장소 소유자가 Settings > Secrets and variables > Actions에 등록해야 합니다(AGENTS.md \"릴리스\")."
            exit 1
          fi

      # verify가 확인한 커밋을 받는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      # 릴리스 빌드는 Gradle 캐시를 읽거나 쓰지 않는다. 다른 실행이 남긴 캐시가 서명할 APK에 섞이지 않게 한다.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # 키스토어는 작업 폴더 밖(RUNNER_TEMP)에 소유자만 읽을 수 있게 둔다. 아티팩트로 올리는 것은 없다.
      - name: 키스토어 풀기
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "::error::RELEASE_KEYSTORE_BASE64를 풀지 못했습니다. base64 한 줄로 넣었는지 확인하세요."; exit 1; }

      # 서명 정보는 환경 변수로만 Gradle에 넘긴다(app/build.gradle.kts). 설정 캐시 파일에 값이 남지 않게 끈다.
      - name: 릴리스 APK 빌드
        env:
          NEXTSET_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          NEXTSET_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          export NEXTSET_RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-configuration-cache --console=plain

      # 단위 테스트(ManifestPermissionTest)는 디버그 매니페스트를 본다. 릴리스는 CI와 같은 방법으로 여기서도 본다(DATA-02).
      - name: Release manifest has no INTERNET permission
        run: |
          manifest=app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          test -f "$manifest" || { echo "::error::병합된 릴리스 매니페스트를 찾지 못했습니다: $manifest"; exit 1; }
          if grep -q '"android.permission.INTERNET"' "$manifest"; then
            echo "::error::릴리스 매니페스트에 INTERNET 권한이 있습니다."
            exit 1
          fi

      # 만든 APK 자체를 읽어 버전, 권한, 서명을 확인한다.
      # versionName은 태그에서 v를 뺀 값, versionCode는 규칙으로 계산한 값이어야 한다(scripts/release-version.mjs).
      - name: APK 확인(버전, 권한, 서명)
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::서명한 릴리스 APK가 없습니다: $apk"; ls -l app/build/outputs/apk/release/ || true; exit 1; }
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$bt/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -E "^package:|uses-permission" "$RUNNER_TEMP/badging.txt"
          node scripts/release-version.mjs apk "$RUNNER_TEMP/badging.txt" --tag "$TAG"
          if grep -q "uses-permission: name='android.permission.INTERNET'" "$RUNNER_TEMP/badging.txt"; then
            echo "::error::APK에 INTERNET 권한이 있습니다."
            exit 1
          fi
          "$bt/apksigner" verify --print-certs "$apk"

      - name: 체크섬 만들기
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dist/next-set-$TAG.apk"
          cd "$RUNNER_TEMP/dist"
          sha256sum "next-set-$TAG.apk" > "next-set-$TAG.apk.sha256"
          cat "next-set-$TAG.apk.sha256"

      # 릴리스 노트는 GitHub이 앞 태그 뒤에 머지된 PR로 만든다(--generate-notes).
      # 시험판(vX.Y.Z-rc.N)은 Pre-release로 표시한다.
      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [ "$PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          gh release create "$TAG" \
            "$RUNNER_TEMP/dist/next-set-$TAG.apk" \
            "$RUNNER_TEMP/dist/next-set-$TAG.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "${prerelease[@]}"

      - name: 키스토어 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
