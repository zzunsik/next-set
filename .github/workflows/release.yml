name: Release

# 버전 태그(v1.2.3)를 push하면 서명한 릴리스 APK를 만들어 GitHub Releases에 올린다(REL-01).
# 절차와 버전 규칙은 AGENTS.md "릴리스"에 있다.
# PR에서는 돌지 않는다. 포크에서 온 PR이 서명 시크릿에 닿지 않게 하려고 태그 push만 받는다.
on:
  push:
    tags: ["v*"]

# Release를 만들려면 contents: write가 필요하다. 이 권한은 이 워크플로에만 준다.
permissions:
  contents: write

# 같은 태그를 두 번 올려도 하나씩 돈다. 진행 중인 릴리스는 취소하지 않는다.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # 시크릿 값은 env로만 넘기고 출력하지 않는다. 있는지만 본다.
      - name: 서명 시크릿 확인
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing RELEASE_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::릴리스 서명 시크릿이 없습니다:$missing. 저장소 소유자가 Settings > Secrets and variables > Actions에 등록해야 합니다(AGENTS.md \"릴리스\")."
            exit 1
          fi

      - name: 태그 형식 확인
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::태그는 vMAJOR.MINOR.PATCH 꼴이어야 합니다(예: v0.1.0): $TAG"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main의 이력을 받아 태그가 main에 있는지 본다.
          fetch-depth: 0
          persist-credentials: false

      # 릴리스는 develop → main 릴리스 PR의 머지 커밋에 태그를 달아 만든다. main에 없는 커밋이면 멈춘다.
      - name: 태그가 main에 있는지 확인
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::태그 $TAG 의 커밋 $GITHUB_SHA 이 main에 없습니다. develop → main 릴리스 PR의 머지 커밋에 태그를 다세요."
            exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      # 릴리스 빌드는 Gradle 캐시를 읽거나 쓰지 않는다. 다른 실행이 남긴 캐시가 서명할 APK에 섞이지 않게 한다.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # 키스토어는 작업 폴더 밖(RUNNER_TEMP)에 소유자만 읽을 수 있게 둔다. 아티팩트로 올리는 것은 없다.
      - name: 키스토어 풀기
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "::error::RELEASE_KEYSTORE_BASE64를 풀지 못했습니다. base64 한 줄로 넣었는지 확인하세요."; exit 1; }

      # 서명 정보는 환경 변수로만 Gradle에 넘긴다(app/build.gradle.kts). 설정 캐시 파일에 값이 남지 않게 끈다.
      - name: 릴리스 APK 빌드
        env:
          NEXTSET_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          NEXTSET_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          export NEXTSET_RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-configuration-cache --console=plain

      # 단위 테스트(ManifestPermissionTest)는 디버그 매니페스트를 본다. 릴리스는 CI와 같은 방법으로 여기서도 본다(DATA-02).
      - name: Release manifest has no INTERNET permission
        run: |
          manifest=app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          test -f "$manifest" || { echo "::error::병합된 릴리스 매니페스트를 찾지 못했습니다: $manifest"; exit 1; }
          if grep -q '"android.permission.INTERNET"' "$manifest"; then
            echo "::error::릴리스 매니페스트에 INTERNET 권한이 있습니다."
            exit 1
          fi

      # 만든 APK 자체를 읽어 버전, 권한, 서명을 확인한다.
      - name: APK 확인(버전, 권한, 서명)
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::서명한 릴리스 APK가 없습니다: $apk"; ls -l app/build/outputs/apk/release/ || true; exit 1; }
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          badging=$("$bt/aapt2" dump badging "$apk")
          echo "$badging" | grep -E "^package:|uses-permission"
          version=$(echo "$badging" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::APK의 versionName($version)이 태그($TAG)와 다릅니다. app/build.gradle.kts의 appVersionName을 고친 뒤 다시 태그를 다세요."
            exit 1
          fi
          if echo "$badging" | grep -q "uses-permission: name='android.permission.INTERNET'"; then
            echo "::error::APK에 INTERNET 권한이 있습니다."
            exit 1
          fi
          "$bt/apksigner" verify --print-certs "$apk"

      - name: 체크섬 만들기
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dist/next-set-$TAG.apk"
          cd "$RUNNER_TEMP/dist"
          sha256sum "next-set-$TAG.apk" > "next-set-$TAG.apk.sha256"
          cat "next-set-$TAG.apk.sha256"

      # 릴리스 노트는 GitHub이 앞 태그 뒤에 머지된 PR로 만든다(--generate-notes).
      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "$RUNNER_TEMP/dist/next-set-$TAG.apk" \
            "$RUNNER_TEMP/dist/next-set-$TAG.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes

      - name: 키스토어 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
